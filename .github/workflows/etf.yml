name: ETF flows
on:
  schedule:
    - cron: '17 1,13,22 * * *'   # 하루 세 번 (미국 장 마감 뒤 집계가 올라오는 시간대 포함)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/etf.py
      - run: |
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add etf.json
          git diff --cached --quiet || (git commit -m "ETF 순유입 갱신" && git push)
